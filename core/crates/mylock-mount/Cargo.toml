[package]
name = "mylock-mount"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "M3 desktop layer: expose a mylock vault as a loopback-only WebDAV (transparent) folder"

[dependencies]
mylock-core = { path = "../mylock-core" }
dav-server = { version = "0.11.0", default-features = false }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
bytes = "1.12.1"
futures-util = "0.3.34"

[[bin]]
name = "mylock-serve"
path = "src/bin/mylock-serve.rs"

[dev-dependencies]
serde_json = "1.0.154"
hex = "0.4.3"
http = "1.5.0"
